[project]
name = "palavra-do-dia"
version = "0.1.0"
description = "Entrega diária de uma passagem bíblica: a IA escolhe a referência, uma API bíblica fornece o texto."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "tzdata>=2024.1",
]

[project.scripts]
palavra-do-dia = "palavra_do_dia.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palavra_do_dia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
