name: Daily Word

on:
  schedule:
    # 12:00 UTC = 09:00 America/Sao_Paulo (UTC-3, no DST). GitHub may delay runs by minutes.
    - cron: "0 12 * * *"
    # Safety nets if Gemini is down: no-ops when today's passage was already delivered.
    - cron: "30 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if today's passage was already delivered"
        type: boolean
        default: false

permissions:
  contents: write # needed to commit data/history.json

concurrency:
  group: daily-word
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Deliver today's passage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run --no-dev palavra-do-dia ${{ inputs.force && '--force' || '' }}

      - name: Commit history
        run: |
          if git diff --quiet -- data/history.json; then
            echo "History unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "chore: record today's passage"
          git push
